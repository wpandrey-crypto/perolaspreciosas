services:
  perolas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perolaspreciosas
    restart: always
    ports:
      - "80:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NODE_ENV=production
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
